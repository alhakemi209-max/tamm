<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم للتحويلات</title>
<meta name="description" content="متابعة تحويلات الموردين بين الفروع ومسؤول التحويلات">
<meta name="theme-color" content="#00286C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تم للتحويلات">
<meta property="og:title" content="تم للتحويلات">
<meta property="og:description" content="متابعة تحويلات الموردين بين الفروع ومسؤول التحويلات">
<meta property="og:image" content="https://alhakemi209-max.github.io/tamm/icons/icon-512.png">
<style>
  html,body{margin:0;height:100%;background:#00286C;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F5F9}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#00286C;transition:opacity .35s;z-index:2}
  #splash img{width:150px;height:150px;border-radius:32px}
  #splash.hide{opacity:0;pointer-events:none}
  .bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#fff;border-radius:3px;animation:mv 1.1s ease-in-out infinite}
  @keyframes mv{0%{transform:translateX(160%)}100%{transform:translateX(-260%)}}
  #msg{color:#fff;font:15px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center;padding:0 24px;max-width:420px}
  #msg a{color:#9FE3B8}
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-512.png" alt="تم للتحويلات"><div class="bar"><i></i></div><div id="msg"></div></div>
<iframe id="app" title="تم للتحويلات" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
  // رابط تطبيق الويب من Apps Script (نشر ← إدارة عمليات النشر ← نسخ الرابط) وينتهي بـ /exec
  const APP_URL = 'https://script.google.com/macros/s/AKfycbxk55JRHSSzCTNWhFazotqYR5IyxxXcVgoNVctdnSHYt2LHqd7AdjbvpCbD-k782DzJ/exec';

  const splash = document.getElementById('splash'), frame = document.getElementById('app'), msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(APP_URL)) {
    document.querySelector('.bar').remove();
    msg.textContent = 'لم يُضبط رابط التطبيق بعد.';
  } else {
    frame.src = APP_URL;
    frame.addEventListener('load', () => setTimeout(() => splash.classList.add('hide'), 250));
    setTimeout(() => { if (!splash.classList.contains('hide')) msg.innerHTML = 'يتأخر التحميل؟ <a href="' + APP_URL + '">افتح التطبيق مباشرة</a>'; }, 15000);
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
